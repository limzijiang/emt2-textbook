<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMT2 數位教科書</title>
<meta name="description" content="中級救護技術員（EMT-2）教科書 110 年版 — OCR 全文、搜尋、原頁對照與章節測驗">
<style>
:root{
  --red:#990011; --red-2:#b3122a; --cream:#FCF6F5; --gold:#C89211;
  --bg:#FCF6F5; --surface:#ffffff; --ink:#2a1a1c; --muted:#6f5a5d; --line:#ecdcdc;
  --hl:#ffe9a8; --ok:#1f7a4a; --bad:#b3122a; --side:#fff;
  --shadow:0 1px 3px rgba(80,0,10,.08),0 6px 20px rgba(80,0,10,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#171113; --surface:#211819; --ink:#f3e9e9; --muted:#b9a5a7; --line:#3a2b2d;
  --hl:#6b5413; --side:#1c1415; --red:#e0596b; --red-2:#ff7a8a; --gold:#e3b54a; --ok:#53c48a; --bad:#ff7a8a;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme=dark]{
  --bg:#171113; --surface:#211819; --ink:#f3e9e9; --muted:#b9a5a7; --line:#3a2b2d;
  --hl:#6b5413; --side:#1c1415; --red:#e0596b; --red-2:#ff7a8a; --gold:#e3b54a; --ok:#53c48a; --bad:#ff7a8a;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
a{color:var(--red)}
button{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#990011;color:#fff;box-shadow:var(--shadow)}
header.top .brand{font-weight:800;letter-spacing:.04em;white-space:nowrap;cursor:pointer}
header.top .brand small{font-weight:500;opacity:.8;margin-left:6px}
header.top .search{flex:1;max-width:520px;margin-left:auto;position:relative}
header.top input{width:100%;padding:8px 12px;border-radius:999px;border:0;font:inherit;font-size:15px;background:rgba(255,255,255,.95);color:#2a1a1c}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px;white-space:nowrap}
#menuBtn{display:none}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 56px)}
nav.side{background:var(--side);border-right:1px solid var(--line);padding:14px 10px 40px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
nav.side .ch{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.45}
nav.side .ch:hover{background:color-mix(in srgb,var(--red) 8%,transparent)}
nav.side .ch.on{background:var(--red);color:#fff}
nav.side .ch .n{flex:none;width:30px;font-weight:800;color:var(--gold)}
nav.side .ch.on .n{color:#ffd77a}
nav.side .ch .done{margin-left:auto;font-size:12px;color:var(--ok)}
nav.side .ch.on .done{color:#c9f5dc}
nav.side h4{margin:16px 10px 6px;font-size:13px;color:var(--muted);letter-spacing:.1em}
main{padding:24px clamp(16px,4vw,56px) 80px;min-width:0}
.wrap{max-width:820px;margin:0 auto}
.kicker{color:var(--gold);font-weight:800;letter-spacing:.12em;font-size:14px}
h1{font-size:30px;line-height:1.35;margin:4px 0 12px;color:var(--red)}
.meta{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin:18px 0 8px;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--red);border-color:var(--red)}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15px;box-shadow:var(--shadow)}
.toc summary{cursor:pointer;font-weight:700}
.toc a{display:block;text-decoration:none;color:var(--ink);padding:2px 0}
.toc a:hover{color:var(--red)}
article .pg{position:relative;padding-top:6px}
.pgmark{display:flex;align-items:center;gap:10px;margin:26px 0 8px;color:var(--muted);font-size:13px}
.pgmark::before,.pgmark::after{content:"";flex:1;height:1px;background:var(--line)}
.pgmark button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.pgmark button:hover{border-color:var(--red);color:var(--red)}
.scan{display:none;margin:8px 0 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.scan.show{display:block}
.scan img{display:block;width:100%;height:auto}
.scan .bar{display:flex;justify-content:space-between;padding:6px 12px;font-size:13px;background:#f6eeee;color:#6f5a5d}
article h2{font-size:23px;color:var(--red);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
article h3{font-size:19px;margin:22px 0 6px;color:var(--ink)}
article h3::before{content:"";display:inline-block;width:6px;height:18px;background:var(--gold);border-radius:3px;margin-right:8px;vertical-align:-2px}
article h4{font-size:17px;margin:16px 0 4px;color:var(--red-2)}
article p{margin:8px 0;text-align:justify}
article .li{margin:4px 0 4px 1.2em;text-indent:-1.2em}
article .cap{font-size:14px;color:var(--muted);text-align:center;margin:6px 0;font-weight:600}
article .fig{display:none}
body.showfrag article .fig{display:inline-block;font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--muted) 10%,transparent);border-radius:4px;padding:0 6px;margin:2px 4px 2px 0}
.tablenote{font-size:13px;color:var(--gold);margin:4px 0}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px}
.pager a{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:13px}
.pager a.next{text-align:right}
/* home */
.hero{background:linear-gradient(135deg,#990011,#5a000c);color:#fff;border-radius:18px;padding:32px 28px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero h1{color:#fff;font-size:34px;margin:6px 0}
.hero .kicker{color:#ffd77a}
.hero p{opacity:.9;margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;transition:transform .12s}
.card:hover{transform:translateY(-2px);border-color:var(--red)}
.card .n{color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.1em}
.card .t{font-weight:700;line-height:1.45}
.card .m{font-size:13px;color:var(--muted);margin-top:auto}
.card .m b{color:var(--ok)}
/* search */
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;cursor:pointer;box-shadow:var(--shadow)}
.result:hover{border-color:var(--red)}
.result .w{font-size:13px;color:var(--muted)}
.result .s{font-size:15px}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.q .lv{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--gold);border-radius:999px;padding:1px 10px;margin-bottom:6px}
.q .lv.A{background:#b5651d}.q .lv.P{background:var(--red)}
.q .stem{font-weight:700;margin-bottom:8px}
.q .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer;line-height:1.6}
.q .opt:hover:not([disabled]){border-color:var(--red)}
.q .opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.q .opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.q .opt[disabled]{cursor:default}
.q .exp{display:none;margin-top:8px;padding:10px 12px;border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:6px;font-size:15px}
.q.answered .exp{display:block}
.score{position:sticky;bottom:12px;background:var(--red);color:#fff;border-radius:999px;padding:8px 18px;display:inline-flex;gap:14px;align-items:center;box-shadow:var(--shadow);font-weight:700}
.score button{background:#fff;color:#990011;border:0;border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:700}
.empty{color:var(--muted);padding:30px 0}
.opts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:6px 0}
.opts label{cursor:pointer}
footer{color:var(--muted);font-size:13px;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:860px){
  #menuBtn{display:inline-block}
  .layout{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;top:56px;width:84vw;max-width:320px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  body.navopen nav.side{transform:none}
  header.top .brand small{display:none}
  header.top .brand .long{display:none}
  header.top{gap:8px;padding:10px 12px}
  h1{font-size:25px}
  .hero h1{font-size:27px}
}
@media print{header.top,nav.side,.pager,.tabs,.pgmark button{display:none}.layout{display:block}}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="目錄">☰</button>
  <div class="brand" onclick="location.hash=''">EMT2<span class="long"> 數位教科書</span><small>中級救護技術員 · 110 年版</small></div>
  <div class="search"><input id="q" type="search" placeholder="全文搜尋：例如 止血帶、AED、GCS…" autocomplete="off"></div>
  <button class="iconbtn" id="themeBtn" title="切換深淺色">◐</button>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<script src="data/book.js?v=1"></script>
<script src="data/quiz.js?v=2"></script>
<script>
const B = window.BOOK, QZ = window.QUIZ || {};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('emt2:'+k); return v==null ? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('emt2:'+k, JSON.stringify(v)); }catch(e){} }
};
// theme
(function(){ const q = new URLSearchParams(location.search).get('theme'); const t = q || store.get('theme', null); if (t) document.documentElement.dataset.theme = t; })();
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nx; store.set('theme', nx);
};
$('#menuBtn').onclick = () => document.body.classList.toggle('navopen');

function quizBest(n){ return store.get('best:'+n, null); }
function sideNav(active){
  let h = '<a class="ch'+(active==null?' on':'')+'" href="#"><span class="n">⌂</span><span>首頁</span></a><h4>章節</h4>';
  for (const c of B.chapters){
    const b = quizBest(c.n), q = QZ[c.n];
    h += `<a class="ch${active===c.n?' on':''}" href="#ch/${c.n}"><span class="n">${c.label?'附':c.n}</span><span>${esc(c.title)}</span>${b!=null&&q?`<span class="done">${b}/${q.length}</span>`:''}</a>`;
  }
  if (B.front) h += '<h4>其他</h4><a class="ch'+(active==='front'?' on':'')+'" href="#front"><span class="n">·</span><span>封面、編撰委員與目錄</span></a>';
  $('#side').innerHTML = h;
}
function blockHTML(b){
  const t = esc(b.t);
  switch(b.k){
    case 'h2': return `<h2>${t}</h2>`;
    case 'h3': return `<h3>${t}</h3>`;
    case 'h4': return `<h4>${t}</h4>`;
    case 'li': return `<p class="li">${t}</p>`;
    case 'cap': return `<p class="cap">${t}</p>`;
    case 'fig': return `<span class="fig">${t}</span>`;
    default: return `<p>${t}</p>`;
  }
}
function pagesHTML(pages){
  let h = '';
  for (const p of pages){
    const label = p.b ? `p.${p.b}` : `PDF ${p.p}`;
    h += `<div class="pg" id="pg${p.p}"><div class="pgmark"><span>${label}</span><button data-scan="${p.p}">${p.tbl?'🖼 本頁有圖表 · 收合／展開原頁':'看原頁'}</button></div>`;
    h += `<div class="scan${p.tbl&&store.get('autoscan',true)?' show':''}" id="scan${p.p}"></div>`;
    h += p.blocks.map(blockHTML).join('') + '</div>';
  }
  return h;
}
function loadScan(n, force){
  const el = $('#scan'+n); if (!el) return;
  if (!el.innerHTML) el.innerHTML = `<div class="bar"><span>原書掃描 · PDF 第 ${n} 頁</span><a href="pages/${String(n).padStart(3,'0')}.jpg" target="_blank" rel="noopener">開新視窗放大</a></div><img loading="lazy" src="pages/${String(n).padStart(3,'0')}.jpg" alt="原書第 ${n} 頁">`;
  if (force !== undefined) el.classList.toggle('show', force);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-scan]');
  if (b){ const n = b.dataset.scan, el = $('#scan'+n); loadScan(n, !el.classList.contains('show')); }
  if (e.target.closest('nav.side a')) document.body.classList.remove('navopen');
});

function home(){
  sideNav(null);
  const total = B.chapters.reduce((a,c)=>a+(QZ[c.n]?QZ[c.n].length:0),0);
  let h = `<div class="hero"><div class="kicker">EMT-2 · 中級救護技術員</div><h1>${esc(B.title)}</h1>
  <p>全書 ${B.pdfPages} 頁 OCR 全文 · ${B.chapters.length} 章 · 每頁可對照原書掃描${total?` · ${total} 題章節測驗`:''}</p></div><div class="grid">`;
  for (const c of B.chapters){
    const b = quizBest(c.n), q = QZ[c.n];
    h += `<a class="card" href="#ch/${c.n}"><span class="n">${c.label||`第 ${c.n} 章`}</span><span class="t">${esc(c.title)}</span>
      <span class="m">p.${c.bookStart} 起 · ${c.pages.length} 頁${q?` · 測驗 ${q.length} 題`:''}${b!=null&&q?` · 最佳 <b>${b}/${q.length}</b>`:''}</span></a>`;
  }
  h += `</div><footer>內容來源：EMT2 教科書（110 年版）掃描檔，以 macOS Vision OCR 轉文字；表格與圖片請以「看原頁」為準。OCR 可能有錯字，引用前請核對原書。章節測驗為依本書內容自編之練習題。</footer>`;
  $('#view').innerHTML = h; scrollTo(0,0);
}
function chapter(n, tab, hit){
  const c = B.chapters.find(x => x.n === n); if (!c) return home();
  sideNav(n);
  const heads = [];
  c.pages.forEach(p => p.blocks.forEach(b => { if (b.k === 'h2') heads.push([p.p, b.t]); }));
  const i = B.chapters.indexOf(c), prev = B.chapters[i-1], next = B.chapters[i+1];
  const q = QZ[n];
  let h = `<div class="kicker">${c.label||`第 ${n} 章`} · p.${c.bookStart}–${c.bookEnd}</div><h1>${esc(c.title)}</h1>
  ${c.authors?`<div class="meta">編撰委員：${esc(c.authors)}</div>`:''}
  <div class="tabs"><button data-tab="read" class="${tab!=='quiz'?'on':''}">📖 閱讀</button>${q?`<button data-tab="quiz" class="${tab==='quiz'?'on':''}">✍️ 章節測驗（${q.length} 題）</button>`:''}</div>`;
  if (tab === 'quiz' && q){
    h += quizHTML(n, q);
  } else {
    if (heads.length) h += `<details class="toc" open><summary>本章小節</summary>${heads.map(([p,t])=>`<a href="#ch/${n}/p${p}">${esc(t)}</a>`).join('')}</details>`;
    h += `<div class="opts"><label><input type="checkbox" id="autoscan" ${store.get('autoscan',true)?'checked':''}> 有圖表的頁面自動展開原頁</label><label><input type="checkbox" id="frag" ${document.body.classList.contains('showfrag')?'checked':''}> 顯示圖內文字碎片</label></div>`;
    h += `<article>${pagesHTML(c.pages)}</article>`;
  }
  h += `<div class="pager">${prev?`<a href="#ch/${prev.n}"><small>← 上一章</small>${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="next" href="#ch/${next.n}"><small>下一章 →</small>${esc(next.title)}</a>`:'<span></span>'}</div>`;
  $('#view').innerHTML = h;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => location.hash = `#ch/${n}${b.dataset.tab==='quiz'?'/quiz':''}`);
  const as = $('#autoscan'); if (as) as.onchange = () => { store.set('autoscan', as.checked); route(); };
  const fr = $('#frag'); if (fr) fr.onchange = () => document.body.classList.toggle('showfrag', fr.checked);
  document.querySelectorAll('.scan.show').forEach(el => loadScan(el.id.slice(4)));
  if (hit){
    const el = $('#pg'+hit.p);
    if (el){
      if (hit.term) highlight(el, hit.term);
      setTimeout(()=>{ const m = el.querySelector('mark') || el; m.scrollIntoView({block:'center'}); }, 30);
      return;
    }
  }
  scrollTo(0,0);
}
function highlight(root, term){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  const lt = term.toLowerCase();
  for (const t of nodes){
    const i = t.data.toLowerCase().indexOf(lt); if (i < 0) continue;
    const r = document.createRange(); r.setStart(t, i); r.setEnd(t, i + term.length);
    const m = document.createElement('mark'); r.surroundContents(m);
  }
}
function quizHTML(n, qs){
  let h = `<p class="meta">依 K-A-P 三層次由淺入深：<b>K</b> 知識記憶 → <b>A</b> 知識應用 → <b>P</b> 解決問題。點選答案立即看解析。</p>`;
  qs.forEach((q, i) => {
    h += `<div class="q" data-i="${i}"><span class="lv ${q.lv}">${{K:'K 知識記憶',A:'A 知識應用',P:'P 解決問題'}[q.lv]||q.lv}</span>
    <div class="stem">${i+1}. ${q.stem}</div>
    ${q.opts.map((o,j)=>`<button class="opt" data-j="${j}">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}
    <div class="exp"><b>答案 ${'ABCD'[q.ans]}</b>　${esc(q.exp)}${q.ref?` <a href="#ch/${n}/p${q.ref}">（見原書）</a>`:''}</div></div>`;
  });
  h += `<div class="score" id="score">得分 <span id="sc">0 / ${qs.length}</span><button id="reset">重做</button></div>`;
  setTimeout(() => {
    let got = 0, done = 0;
    document.querySelectorAll('.q').forEach(el => {
      const q = qs[+el.dataset.i];
      el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (el.classList.contains('answered')) return;
        el.classList.add('answered'); done++;
        const j = +b.dataset.j;
        el.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.j === q.ans) x.classList.add('ok'); });
        if (j === q.ans) got++; else b.classList.add('bad');
        $('#sc').textContent = `${got} / ${qs.length}`;
        if (done === qs.length){ const best = quizBest(n); if (best == null || got > best) store.set('best:'+n, got); sideNav(n); }
      });
    });
    $('#reset').onclick = () => route();
  });
  return h;
}
function front(){
  sideNav('front');
  $('#view').innerHTML = `<h1>封面、編撰委員與目錄</h1><article>${pagesHTML(B.front)}</article>`;
  document.querySelectorAll('.scan.show').forEach(el => loadScan(el.id.slice(4)));
  scrollTo(0,0);
}
// search
const IDX = [];
for (const c of B.chapters) for (const p of c.pages){ IDX.push({c, p, text: p.blocks.map(b=>b.t).join('\n')}); }
function search(term){
  sideNav(-1);
  const t = term.trim(); if (!t){ home(); return; }
  const lt = t.toLowerCase(); const res = [];
  for (const r of IDX){
    const L = r.text.toLowerCase(); let i = L.indexOf(lt), cnt = 0, first = i;
    while (i >= 0){ cnt++; i = L.indexOf(lt, i + lt.length); }
    if (cnt) res.push({r, cnt, first});
  }
  let h = `<div class="kicker">全文搜尋</div><h1>「${esc(t)}」</h1><p class="meta">共 ${res.reduce((a,x)=>a+x.cnt,0)} 處，分布於 ${res.length} 頁</p>`;
  if (!res.length) h += `<div class="empty">找不到。OCR 可能把字辨識成同音或形近字，試試較短的關鍵字。</div>`;
  for (const {r, cnt, first} of res.slice(0, 200)){
    const s = Math.max(0, first - 40), snip = r.text.slice(s, first + t.length + 60).replace(/\n/g,' ');
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    h += `<div class="result" data-go="#ch/${r.c.n}/p${r.p.p}/${encodeURIComponent(t)}"><div class="w">${r.c.label||`第 ${r.c.n} 章`} ${esc(r.c.title)} · p.${r.p.b||'?'} · ${cnt} 處</div><div class="s">${s?'…':''}${esc(snip).replace(re, m=>`<mark>${m}</mark>`)}…</div></div>`;
  }
  $('#view').innerHTML = h;
  document.querySelectorAll('.result').forEach(el => el.onclick = () => location.hash = el.dataset.go);
}
let st; $('#q').addEventListener('input', e => { clearTimeout(st); st = setTimeout(() => { location.hash = e.target.value.trim() ? '#s/' + encodeURIComponent(e.target.value.trim()) : ''; }, 250); });
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if (!h) return home();
  if (h === 'front') return front();
  if ((m = h.match(/^s\/(.+)$/))){ if ($('#q').value !== m[1]) $('#q').value = m[1]; return search(m[1]); }
  if ((m = h.match(/^ch\/(\d+)\/quiz$/))) return chapter(+m[1], 'quiz');
  if ((m = h.match(/^ch\/(\d+)\/p(\d+)(?:\/(.+))?$/))) return chapter(+m[1], 'read', {p:+m[2], term:m[3]});
  if ((m = h.match(/^ch\/(\d+)$/))) return chapter(+m[1], 'read');
  home();
}
addEventListener('hashchange', route); route();
</script>
</body>
